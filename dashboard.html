<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Presentation Dashboard</title>

    <link rel="stylesheet" href="dist/reset.css">
    <link rel="stylesheet" href="dist/reveal.css">
    <link rel="stylesheet" href="dist/theme/black.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #191919;
            color: #fff;
            padding: 2rem;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .presentations {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .presentation {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .presentation:hover {
            transform: translateY(-5px);
            background-color: #3d3d3d;
        }
        .presentation h2 {
            font-size: 1.5rem;
            margin: 0 0 1rem 0;
        }
        .presentation p {
            margin: 0.5rem 0;
            opacity: 0.7;
        }
        .presentation a {
            display: inline-block;
            margin-top: 1rem;
            background-color: #0074d9;
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        .presentation a:hover {
            background-color: #0063b1;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Presentation Dashboard</h1>
        <div class="presentations" id="presentations-container">
            <!-- Presentations will be loaded here dynamically -->
            <div class="presentation">
                <h2>Loading...</h2>
                <p>Please wait while we find your presentations.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/presentations');
                const presentations = await response.json();
                
                const container = document.getElementById('presentations-container');
                
                if (presentations.length === 0) {
                    container.innerHTML = `
                        <div class="presentation">
                            <h2>No presentations found</h2>
                            <p>Add markdown files to your presentations directory to get started.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = presentations.map(presentation => `
                    <div class="presentation">
                        <h2>${presentation.title}</h2>
                        <p>Last modified: ${new Date(presentation.lastModified).toLocaleDateString()}</p>
                        <a href="/presentation/${presentation.id}">View Presentation</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading presentations:', error);
                document.getElementById('presentations-container').innerHTML = `
                    <div class="presentation">
                        <h2>Error loading presentations</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
